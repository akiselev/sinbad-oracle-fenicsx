[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinbad-oracle-fenicsx"
version = "0.1.0"
description = "Independent FEniCSx/dolfinx verification oracle adapter for Sinbad's sinbad-oracle-protocol/1 (SV0-C5)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sinbad federation" }]
# License deferred per workspace convention (sinbad/CLAUDE.md, AGENTS.md);
# revisit when a concrete export/release-preparation work package requires it.

[project.scripts]
sinbad-oracle-fenicsx = "sinbad_oracle_fenicsx.adapter:main"

[project.optional-dependencies]
# The protocol/CLI layer (protocol.py, capability.py, adapter.py) has zero
# third-party dependencies by design, so ordinary offline tests need none of
# this. Install this extra only in an environment that already provides a
# working FEniCSx/dolfinx stack (see INSTALL.md) to exercise poisson.py.
dolfinx = ["mpi4py", "numpy"]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/sinbad_oracle_fenicsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
